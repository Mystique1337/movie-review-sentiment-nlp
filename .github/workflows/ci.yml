name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # Installed from requirements.txt with the transformer stack filtered
        # out: the unit tests never touch PyTorch, and pulling it would add
        # several minutes per matrix entry. Deriving the list from the file
        # rather than restating it keeps CI from drifting out of sync.
        run: |
          python -m pip install --upgrade pip
          grep -viE '^(torch|transformers)' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt

      - name: Fetch NLTK resources
        run: python -c "import nltk; [nltk.download(p, quiet=True) for p in ['stopwords','wordnet','omw-1.4','punkt','punkt_tab','movie_reviews']]"

      - name: Run tests
        run: python -m pytest tests/ -v
