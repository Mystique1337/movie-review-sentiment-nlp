name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # The unit tests exercise preprocessing, the model zoo and the
        # aggregation layer, none of which need PyTorch, so the transformer
        # dependencies are skipped to keep CI fast.
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn nltk joblib matplotlib tabulate pytest

      - name: Fetch NLTK resources
        run: python -c "import nltk; [nltk.download(p, quiet=True) for p in ['stopwords','wordnet','omw-1.4','punkt','punkt_tab']]"

      - name: Run tests
        run: python -m pytest tests/ -v
